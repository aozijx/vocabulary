<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>单词本</title>
    <link rel="icon" href="src/img/halloween_hat_witch_horror_magic_icon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Consolas", "Segoe UI",
                Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.5s ease-out;
        }

        .main-content {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            width: 100%;
            max-width: 64rem;
            transition: all 0.7s;
        }

        .page-title {
            text-align: center;
            color: var(--primary-color-hover);
            margin-bottom: 1rem;
            font-size: 1.5rem;
            user-select: none;
        }

        /* 卡片容器 */
        .card-container {
            flex: 1;
            background-color: var(--card-bg-color);
            border: 1px solid var(--card-border-color);
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 1.5rem;
            align-self: stretch;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color-hover);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border-color);
            padding-bottom: 1rem;
            user-select: none;
        }

        .page-title i,
        .card-title i,
        .control-btn i {
            margin-right: 0.5rem;
        }

        footer {
            position: fixed;
            bottom: 10px;
            color: #6b7280;
            white-space: nowrap;
            user-select: none;
        }

        footer a {
            color: inherit;
        }
    </style>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="src/styles/style.css" />
    <!-- 引入移动端适配样式表 -->
    <link rel="stylesheet" href="src/styles/mobile.css" />
</head>

<body>
    <!-- 暗黑模式切换按钮 -->
    <button id="theme-toggle" class="toggle-btn theme-toggle" title="切换" type="button">
        <i class="fa fa-moon-o"></i>
    </button>

    <div class="main-content">
        <div class="card-container">
            <!-- 页面标题 -->
            <h1 class="page-title"><i class="fa fa-book"></i>单词本</h1>

            <!-- 搜索区域 -->
            <div class="search-area">
                <input type="text" id="searchInput" class="search-input" placeholder="输入单词或索引跳转..." />
                <button id="searchBtn" class="search-btn" title="搜索" type="button">
                    <i class="fa fa-search"></i>
                </button>
            </div>

            <!-- 单词卡片 -->
            <div class="word-card">
                <div class="word-header">
                    <span class="word-text">正在加载...</span>
                    <button class="control-btn" id="dictationBtn" type="button">拼写</button>
                    <span class="word-level">unknown</span>
                </div>

                <!-- 发音和音标容器 -->
                <div class="phonetic-container">
                    <span class="word-phonetic"></span>
                    <div class="pronounce-group" data-word="">
                        <div class="pronounce-item" data-type="1" title="英式发音">
                            <span class="label">英</span>
                            <i class="fa fa-volume-up"></i>
                        </div>
                        <div class="pronounce-item" data-type="0" title="美式发音">
                            <span class="label">美</span>
                            <i class="fa fa-volume-up"></i>
                        </div>
                        <div style="color: var(--text-color-secondary)">默认美音</div>
                    </div>
                </div>

                <!-- 词性与释义的容器 -->
                <div class="definition-container">
                    <div class="word-pos"></div>
                    <div class="word-def"></div>
                </div>
            </div>

            <!-- 短语 -->
            <div class="phrase">
                <h2 class="card-title"><i class="fa fa-link"></i>相关短语</h2>
                <div class="phrase-list"><strong>请先加载单词...</strong></div>
            </div>

            <!-- 控制按钮区域 -->
            <div class="control-area">
                <button class="control-btn prev-btn" title="back" type="button">
                    <i class="fa fa-arrow-left"></i>
                    <span>上一个</span>
                </button>
                <span class="progress-text">0 / 0</span>
                <!-- 右侧按钮组 -->
                <div class="right-controls">
                    <button id="randomBtn" class="control-btn" title="random" type="button">
                        <i class="fa fa-random"></i>
                        <span>随机</span>
                    </button>
                    <button class="control-btn next-btn" title="next" type="button">
                        <span>下一个</span>
                        <i class="fa fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 例句容器 -->
        <div class="card-container">
            <h2 class="card-title"><i class="fa fa-comments-o"></i> 相关例句</h2>
            <div class="sentences-list">
                <p>请先加载单词...</p>
            </div>
        </div>
    </div>

    <!-- 设置按钮 -->
    <button id="settingsBtn" class="toggle-btn settings-btn" title="设置" type="button">
        <i class="fa fa-cog"></i>
    </button>

    <!-- 模态框 -->
    <div id="settingsModal" class="modal-overlay">
        <button id="closeModalBtn" class="close-btn" title="close" type="button">
            &times;
        </button>
        <div class="card-container modal-card">
            <div class="modal-content">
                <h3 class="setting-header">词书列表</h3>
                <ul id="book">
                    <li class="active" data-book="CET4"><button type="button">大学英语四级核心词汇</button><button id="addWord">添加</button></li>
                    <li class="active" data-book="CET6"><button type="button">大学英语六级核心词汇</button><button id="addWord">添加</button></li>
                    <li class="disabled" data-book=""><button type="button">待添加...</button></li>
                </ul>

                <!-- 静态书籍链接列表 -->
                <h3 class="setting-header">单词</h3>
                <ul>
                    <li>
                        <a href="https://gitee.com/zhangchang521/english-word" target="_blank" rel="noopener noreferrer"
                            rel="noopener noreferrer"><i class="fa fa-github"></i>Gitee </a><i
                            class="fa fa-external-link"></i>
                    </li>
                    <li>
                        <a href="https://github.com/mahavivo/english-wordlists" target="_blank"
                            rel="noopener noreferrer" rel="noopener noreferrer"><i class="fa fa-github"></i>Github
                        </a><i class="fa fa-external-link"></i>
                    </li>
                    <li>
                        <a href="https://github.com/KyleBing/english-vocabulary" target="_blank"
                            rel="noopener noreferrer" rel="noopener noreferrer"><i class="fa fa-github"></i>Github
                        </a><i class="fa fa-external-link"></i>
                    </li>
                    <li>
                        <a href="https://github.com/KyleBing/vocabulary" target="_blank" rel="noopener noreferrer">
                            <i></i>"蚕食" 应用</a><i class="fa fa-external-link"></i>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 单词本
        <a href="https://gitee.com/zhangchang521/english-word#https://gitee.com/link?target=http%3A%2F%2Fydschool-online.nos.netease.com%2F1524052539052_CET4luan_2.zip"
            target="_blank" rel="noopener noreferrer">词表</a>
        <a href="https://github.com/aozijx/vocabulary" target="_blank" rel="noopener noreferrer">Github</a>
    </footer>
    <script src="src/js/script.js" defer></script>
</body>

</html>
